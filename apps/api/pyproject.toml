[project]
name = "api-galaxy-api"
version = "0.1.0"
description = "API Galaxy backend — deterministic OpenAPI parsing, graph engine, semantic providers and exports."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "networkx>=3.3",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# PDF export. Needs the pango and cairo system libraries as well as the wheel
# (macOS: `brew install pango cairo`, Debian: `apt install libpango-1.0-0 libcairo2`).
# Without it the export registry marks the PDF format unavailable and the product offers
# the print-ready HTML instead — it never silently substitutes a different artifact.
pdf = ["weasyprint>=62"]
# PNG export. Rasterises the diagram SVG; needs the cairo system library
# (macOS: `brew install cairo`, Debian: `apt install libcairo2`).
png = ["cairosvg>=2.7"]
keyring = ["keyring>=25"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "pypdf>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api_galaxy*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# B008: FastAPI's Depends()/Query() defaults are the documented idiom.
# E501: long lines are allowed in prose docstrings; code stays within 100.
# UP042: `str, Enum` is deliberate — it is what makes these enums serialise to plain
#        strings in JSON responses and compare equal to the strings the web app sends.
ignore = ["B008", "E501", "UP042"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["../../tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
