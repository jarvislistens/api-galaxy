[pytest]
# Lives at the repo root so `pytest` works from anywhere without arguments — the
# per-package config in apps/api/pyproject.toml only applies when that is the rootdir.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    e2e: browser tests, run separately with Playwright
